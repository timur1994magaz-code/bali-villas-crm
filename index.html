<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bali Villas CRM — управление субарендой вилл</title>
<meta name="description" content="Управленческая CRM для субаренды вилл на Бали: виллы, контакты, условия, цены, фото, локации, календарь занятости и клиенты.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>">
<link rel="stylesheet" href="assets/styles.css?v=6">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-logo">🌴</span>
      <div>
        <div class="brand-title">Bali Villas</div>
        <div class="brand-sub">CRM субаренды</div>
      </div>
    </div>
    <nav class="nav">
      <a class="nav-item" href="#/dashboard"><span class="ico">📊</span> Дашборд</a>
      <a class="nav-item" href="#/villas"><span class="ico">🏝️</span> Виллы</a>
      <a class="nav-item" href="#/search"><span class="ico">🔎</span> Подбор</a>
      <a class="nav-item" href="#/calendar"><span class="ico">🗓️</span> Календарь</a>
      <a class="nav-item" href="#/clients"><span class="ico">👤</span> Клиенты</a>
      <a class="nav-item" href="#/settings"><span class="ico">⚙️</span> Настройки</a>
    </nav>
    <div class="sidebar-foot">
      <button class="btn btn-ghost btn-sm" id="btn-quick-villa">+ Новая вилла</button>
      <button class="btn btn-ghost btn-sm" id="btn-quick-booking">+ Новая бронь</button>
      <div class="storage-note" id="storage-note"></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="btn btn-icon only-mobile" id="btn-menu" aria-label="Меню">☰</button>
      <h1 class="page-title" id="page-title">Дашборд</h1>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>
<div class="modal-root" id="modal-root" hidden></div>
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" data-lb="close" aria-label="Закрыть">✕</button>
  <button class="lb-nav lb-prev" data-lb="prev" aria-label="Назад">‹</button>
  <button class="lb-nav lb-next" data-lb="next" aria-label="Вперёд">›</button>
  <img id="lightbox-img" alt="">
  <div class="lb-caption" id="lightbox-caption"></div>
</div>
<div class="toasts" id="toasts"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
